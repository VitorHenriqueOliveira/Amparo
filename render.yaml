services:
    - type: web
      name: amparo-api
      runtime: node
      plan: free
      branch: dev
      rootDir: backend
      buildCommand: npm ci --omit=dev
      startCommand: node src/server.js
      autoDeployTrigger: off
      envVars:
          - key: NODE_VERSION
            value: 24.22.0
          - key: NODE_ENV
            value: production
          - key: TRUST_PROXY_HOPS
            value: 1
          - key: DATABASE_URL
            sync: false
          - key: JWT_SECRET
            generateValue: true
          - key: CORS_ORIGINS
            sync: false
